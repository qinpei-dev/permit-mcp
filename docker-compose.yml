services:
  permit-mcp:
    build: .
    environment:
      PERMITMCP_EXECUTION_TOKEN: ${PERMITMCP_EXECUTION_TOKEN:-}
      PERMITMCP_APPROVAL_TOKEN: ${PERMITMCP_APPROVAL_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
