[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permit-mcp"
version = "0.5.0rc1"
description = "Permit-controlled MCP execution layer"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "pydantic>=2.6,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2", "mcp>=1.6,<2", "jsonschema>=4.20,<5"]

[project.scripts]
permit-mcp = "src.mcp.server:main"
permit-mcp-upstream = "src.upstream.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
